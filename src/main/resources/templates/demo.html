<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>HTML 表格示例</title>
    <style>
        table {
            width: 50%;
            border-collapse: collapse;
            margin: 20px auto;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <h2 style="text-align: center;">学生信息表</h2>
    <table>
        <tr>
            <th>姓名</th>
            <th>年龄</th>
            <th>班级</th>
        </tr>
        <tr>
            <td>张三</td>
            <td>20</td>
            <td>计算机科学</td>
        </tr>
        <tr>
            <td>李四</td>
            <td>21</td>
            <td>电子工程</td>
        </tr>
        <tr>
            <td>王五</td>
            <td>22</td>
            <td>机械工程</td>
        </tr>
    </table>
</body>
</html>
