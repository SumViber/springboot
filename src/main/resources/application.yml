# 服务端口以及路径配置
server:
  port: 8090
  servlet:
    context-path: /mcsr
# 数据库连接配置
spring:
  datasource:
      url: jdbc:mysql://localhost:3306/summer?useUnicode=true&characterEncoding=utf-8&serverTimezone=UTC
      username: root
      password: root1234
      driver-class-name: com.mysql.cj.jdbc.Driver
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

# swagger
swagger:
  enabled: true

# mapper文件的扫描路径
mybatis-flex:
  mapper-locations:
    - classpath*:/mappers/*.xml









